name: Atualizar conteudo semanal

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar conteudo da semana
        run: node automacao/rotacionar.mjs

      - name: Validar arquivos
        run: |
          node --check posts.js
          node --check radar.js

      - name: Commit e push (se mudou algo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.js radar.js
          git diff --staged --quiet || git commit -m "conteudo semanal automatico"
          git push
